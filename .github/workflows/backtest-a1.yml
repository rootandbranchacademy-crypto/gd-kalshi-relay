name: GD-C1.0 approximate backtest A1 (collection only)

# Separate approximate cohort GD-C1.0-BT-A1. Collection only: outcome-blind replay and
# scoring happen afterwards from the committed files, after annotations are frozen.
# Never affects the daily relay, the prospective log or GD-C1.0 totals.
on:
  push:
    branches: [bt-a1-run]
    paths:
      - '.github/workflows/backtest-a1.yml'
      - 'backtest/a1_collect_request.json'

permissions:
  contents: write

concurrency:
  group: gd-a1-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chunk:
          - {start: '2026-04-14', end: '2026-04-30'}
          - {start: '2026-05-01', end: '2026-05-31'}
          - {start: '2026-06-01', end: '2026-06-30'}
          - {start: '2026-07-01', end: '2026-07-31'}
          - {start: '2026-08-01', end: '2026-08-31'}
          - {start: '2026-09-01', end: '2026-09-30'}
          - {start: '2026-10-01', end: '2026-10-13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrity tests
        run: python3 -m unittest discover -s backtest -p 'test_*.py' -v
      - uses: actions/cache@v4
        with:
          path: .a1-cache
          key: gd-a1-${{ matrix.chunk.start }}-${{ github.run_id }}
          restore-keys: gd-a1-${{ matrix.chunk.start }}-
      - name: Collect public Kalshi candles and ESPN records
        run: |
          out="data/backtest/a1/${{ matrix.chunk.start }}_${{ matrix.chunk.end }}"
          mkdir -p "$out" .a1-cache
          ln -s "$GITHUB_WORKSPACE/.a1-cache" "$out/raw"
          python3 backtest/collect.py --start "${{ matrix.chunk.start }}" --end "${{ matrix.chunk.end }}" --out "$out" --sports mlb,nba,nhl,nfl
      - name: Commit chunk
        if: always()
        run: |
          git config user.name gd-backtest-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find data/backtest/a1 -type l -name raw -delete
          git add data/backtest/a1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: A1 collection ${{ matrix.chunk.start }}..${{ matrix.chunk.end }} (approximate cohort)"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((attempt * 7))
          done
          exit 1
